<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#D4A373">
<title>Chore Cafe</title>
<style>
  :root {
    --cream: #FEFAE0;
    --card: #FFFEF7;
    --tan: #D4A373;
    --tan-dark: #B08554;
    --cocoa: #5C4033;
    --muted: #8B7355;
    --line: #E8DCC4;
    --error: #A33F32;
    --bounty: #C4622D;
    --bounty-bg: #FDF0E4;
    --gift: #6B7F53;
    --easy: #C9B8A0;
    --medium: #A98A6B;
    --hard: #5C4033;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--cream);
    color: var(--cocoa);
    font-family: ui-rounded, "Segoe UI", system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.5;
  }

  .wrap { max-width: 560px; margin: 0 auto; padding: 20px 16px 60px; }

  .centered {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 32px 28px;
    width: 100%;
    max-width: 380px;
  }

  .sign { text-align: center; margin-bottom: 28px; }
  .sign h1 { font-size: 28px; font-weight: 600; margin: 0 0 4px; letter-spacing: -0.01em; }
  .sign p { margin: 0; color: var(--muted); font-size: 14px; }

  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    margin-bottom: 6px;
  }

  input[type="email"],
  input[type="password"],
  input[type="text"],
  input[type="date"],
  select {
    width: 100%;
    padding: 12px 14px;
    font-size: 16px;
    font-family: inherit;
    color: var(--cocoa);
    background: var(--cream);
    border: 1px solid var(--line);
    border-radius: 10px;
    margin-bottom: 16px;
  }

  input:focus, select:focus {
    outline: 2px solid var(--tan);
    outline-offset: 1px;
    border-color: var(--tan);
  }

  button {
    font-family: inherit;
    font-size: 16px;
    font-weight: 600;
    color: #fff;
    background: var(--tan);
    border: none;
    border-radius: 10px;
    padding: 12px;
    cursor: pointer;
  }

  button:hover:not(:disabled) { background: var(--tan-dark); }
  button:focus-visible { outline: 2px solid var(--cocoa); outline-offset: 2px; }
  button:disabled { opacity: 0.55; cursor: default; }

  button.wide { width: 100%; padding: 13px; }

  button.quiet {
    background: none;
    color: var(--muted);
    font-weight: 500;
    font-size: 14px;
    padding: 8px;
  }

  button.quiet:hover:not(:disabled) { background: var(--cream); color: var(--cocoa); }

  button.small { font-size: 14px; padding: 9px 16px; }
  button.tiny { font-size: 13px; padding: 6px 12px; }

  button.outline {
    background: none;
    color: var(--muted);
    border: 1px solid var(--line);
  }

  button.outline:hover:not(:disabled) {
    background: var(--cream);
    color: var(--cocoa);
    border-color: var(--tan);
  }

  button.gift {
    background: none;
    color: var(--gift);
    border: 1px solid var(--gift);
  }

  button.gift:hover:not(:disabled) { background: var(--gift); color: #fff; }

  .error { color: var(--error); font-size: 14px; margin: 0 0 16px; }
  .hidden { display: none !important; }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding-bottom: 16px;
    border-bottom: 1px dashed var(--line);
  }

  header h1 { font-size: 22px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
  header .who { font-size: 13px; color: var(--muted); margin: 2px 0 0; }

  .jar { text-align: right; white-space: nowrap; }
  .jar .count { font-size: 22px; font-weight: 600; display: block; line-height: 1.2; }
  .jar .label { font-size: 12px; color: var(--muted); }

  .notice {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    background: var(--card);
    border: 1px dashed var(--tan);
    border-radius: 12px;
    padding: 12px 14px;
    margin-top: 16px;
  }

  .notice p { margin: 0; font-size: 14px; color: var(--muted); }

  .add-bar { display: flex; gap: 10px; margin: 16px 0 4px; }
  .add-bar button { flex: 1; padding: 13px; }

  h2 {
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    margin: 28px 0 10px;
  }

  .chore {
    background: var(--card);
    border: 1px solid var(--line);
    border-left: 5px solid var(--medium);
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
  }

  .chore.d-easy { border-left-color: var(--easy); }
  .chore.d-medium { border-left-color: var(--medium); }
  .chore.d-hard { border-left-color: var(--hard); }

  .chore.is-bounty {
    border-color: var(--bounty);
    border-width: 2px;
    border-left-width: 5px;
    background: var(--bounty-bg);
  }

  .chore .info { min-width: 0; }
  .chore .name { font-weight: 600; margin: 0 0 3px; overflow-wrap: anywhere; }
  .chore .meta { font-size: 13px; color: var(--muted); margin: 0; }
  .chore .meta .late { color: var(--error); font-weight: 600; }
  .chore .meta .coins { color: var(--cocoa); font-weight: 600; }

  .tag {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #fff;
    background: var(--bounty);
    border-radius: 4px;
    padding: 2px 6px;
    margin-bottom: 5px;
  }

  .buttons { display: flex; gap: 8px; }

  .empty {
    color: var(--muted);
    font-size: 14px;
    font-style: italic;
    margin: 0 0 10px;
    padding: 4px 2px;
  }

  .entry {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 11px 2px;
    border-bottom: 1px solid var(--line);
  }

  .entry:last-child { border-bottom: none; }
  .entry .what { font-size: 15px; margin: 0; overflow-wrap: anywhere; }
  .entry .when { font-size: 12px; color: var(--muted); margin: 2px 0 0; }
  .entry .amount { font-weight: 600; white-space: nowrap; }
  .entry.is-gift .what { color: var(--gift); }
  .entry .right { display: flex; align-items: center; gap: 10px; white-space: nowrap; }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 20px;
    transform: translateX(-50%);
    background: var(--cocoa);
    color: var(--cream);
    font-size: 14px;
    padding: 11px 18px;
    border-radius: 999px;
    max-width: 90vw;
    text-align: center;
    z-index: 100;
  }

  .footer { margin-top: 36px; text-align: center; }
  .footer .status { font-size: 12px; color: var(--muted); margin: 8px 0 0; }

  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(92, 64, 51, 0.45);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    overflow-y: auto;
    z-index: 60;
  }

  .sheet {
    background: var(--card);
    border-radius: 16px;
    padding: 24px;
    width: 100%;
    max-width: 420px;
    max-height: 92vh;
    overflow-y: auto;
  }

  .sheet h2 {
    font-size: 20px;
    font-weight: 600;
    text-transform: none;
    letter-spacing: -0.01em;
    color: var(--cocoa);
    margin: 0 0 6px;
  }

  .sheet .lead { font-size: 14px; color: var(--muted); margin: 0 0 20px; }

  .days { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
  .days input { position: absolute; opacity: 0; width: 0; height: 0; }
  .days label { margin: 0; }

  .days span {
    display: inline-block;
    font-size: 14px;
    font-weight: 500;
    color: var(--muted);
    background: var(--cream);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 7px 13px;
    cursor: pointer;
  }

  .days input:checked + span { background: var(--tan); border-color: var(--tan); color: #fff; }
  .days input:focus-visible + span { outline: 2px solid var(--cocoa); outline-offset: 2px; }

  .sheet-actions { display: flex; gap: 10px; margin-top: 4px; }
  .sheet-actions button { flex: 1; padding: 13px; }
</style>
</head>
<body>

<div id="login-screen" class="centered hidden">
  <div class="card">
    <div class="sign">
      <h1>Chore Cafe</h1>
      <p>Now serving</p>
    </div>
    <form id="login" autocomplete="on">
      <p id="error" class="error hidden"></p>
      <label for="email">Email</label>
      <input type="email" id="email" name="email" autocomplete="username" required>
      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>
      <button type="submit" class="wide" id="signin-btn">Sign in</button>
    </form>
  </div>
</div>

<div id="loading-screen" class="centered">
  <p style="color:#8B7355">Opening up&hellip;</p>
</div>

<div id="board-screen" class="wrap hidden">

  <header>
    <div>
      <h1>Chore Cafe</h1>
      <p class="who" id="who"></p>
    </div>
    <div class="jar">
      <span class="count" id="coin-count">0</span>
      <span class="label">coins</span>
    </div>
  </header>

  <div id="push-notice" class="notice hidden">
    <p>Get told when chores go overdue.</p>
    <button type="button" class="small" id="enable-push">Turn on</button>
  </div>

  <div class="add-bar">
    <button type="button" id="open-add">Add a chore</button>
    <button type="button" class="outline" id="open-log">Log something</button>
  </div>

  <h2>Yours</h2>
  <div id="mine"></div>

  <h2>Up for grabs</h2>
  <div id="pool"></div>

  <h2 id="theirs-heading">Theirs</h2>
  <div id="theirs"></div>

  <h2>Recently</h2>
  <div id="activity"></div>

  <div class="footer">
    <button type="button" class="quiet" id="signout-btn">Sign out</button>
    <p class="status" id="push-status"></p>
  </div>

</div>

<div id="add-overlay" class="overlay hidden">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="add-title">
    <h2 id="add-title">New chore</h2>
    <p class="lead">Goes on the board for either of you to pick up.</p>
    <form id="add-form">
      <p id="add-error" class="error hidden"></p>

      <label for="c-name">What needs doing</label>
      <input type="text" id="c-name" maxlength="80" required>

      <label for="c-difficulty">Difficulty</label>
      <select id="c-difficulty">
        <option value="easy">Easy</option>
        <option value="medium" selected>Medium</option>
        <option value="hard">Hard</option>
      </select>

      <label for="c-frequency">How often</label>
      <select id="c-frequency">
        <option value="one_time">One-time bounty</option>
        <option value="on_demand">Whenever it needs doing</option>
        <option value="daily">Certain days each week</option>
        <option value="weekly" selected>Weekly</option>
        <option value="biweekly">Every two weeks</option>
        <option value="monthly">Monthly</option>
        <option value="quarterly">Every three months</option>
      </select>

      <div id="days-block" class="hidden">
        <label>Which days</label>
        <div class="days" id="days">
          <label><input type="checkbox" value="1"><span>Mon</span></label>
          <label><input type="checkbox" value="2"><span>Tue</span></label>
          <label><input type="checkbox" value="3"><span>Wed</span></label>
          <label><input type="checkbox" value="4"><span>Thu</span></label>
          <label><input type="checkbox" value="5"><span>Fri</span></label>
          <label><input type="checkbox" value="6"><span>Sat</span></label>
          <label><input type="checkbox" value="0"><span>Sun</span></label>
        </div>
      </div>

      <div id="due-block">
        <label for="c-due">First due date</label>
        <input type="date" id="c-due">
      </div>

      <div class="sheet-actions">
        <button type="button" class="outline" id="cancel-add">Cancel</button>
        <button type="submit" id="add-submit">Add to the board</button>
      </div>
    </form>
  </div>
</div>

<div id="log-overlay" class="overlay hidden">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="log-title">
    <h2 id="log-title">Log something you did</h2>
    <p class="lead">For work that was never on the board. Paid at the usual rate.</p>
    <form id="log-form">
      <p id="log-error" class="error hidden"></p>

      <label for="l-name">What did you do</label>
      <input type="text" id="l-name" maxlength="80" required>

      <label for="l-difficulty">Difficulty</label>
      <select id="l-difficulty">
        <option value="easy">Easy</option>
        <option value="medium" selected>Medium</option>
        <option value="hard">Hard</option>
      </select>

      <div class="sheet-actions">
        <button type="button" class="outline" id="cancel-log">Cancel</button>
        <button type="submit" id="log-submit">Claim the coins</button>
      </div>
    </form>
  </div>
</div>

<div id="gift-overlay" class="overlay hidden">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="gift-title">
    <h2 id="gift-title">Say something nice</h2>
    <p class="lead" id="gift-lead"></p>
    <form id="gift-form">
      <p id="gift-error" class="error hidden"></p>

      <label for="g-note">Your note</label>
      <input type="text" id="g-note" maxlength="120" required>

      <div class="sheet-actions">
        <button type="button" class="outline" id="cancel-gift">Cancel</button>
        <button type="submit" id="gift-submit">Send it</button>
      </div>
    </form>
  </div>
</div>

<script src="config.js"></script>
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let me = null;
  let settings = null;
  let people = {};
  let giftTarget = null;
  let boardChannel = null;
  let refreshTimer = null;

  const DAY_NAMES = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];

  function $(id) { return document.getElementById(id); }

  function showScreen(name) {
    $("loading-screen").classList.toggle("hidden", name !== "loading");
    $("login-screen").classList.toggle("hidden", name !== "login");
    $("board-screen").classList.toggle("hidden", name !== "board");
  }

  function toast(message) {
    const existing = document.querySelector(".toast");
    if (existing) existing.remove();
    const node = document.createElement("div");
    node.className = "toast";
    node.setAttribute("role", "status");
    node.textContent = message;
    document.body.appendChild(node);
    setTimeout(function () { node.remove(); }, 3200);
  }

  function escapeHtml(text) {
    const div = document.createElement("div");
    div.textContent = text;
    return div.innerHTML;
  }

  function todayISO() {
    const d = new Date();
    return d.getFullYear() + "-" +
           String(d.getMonth() + 1).padStart(2, "0") + "-" +
           String(d.getDate()).padStart(2, "0");
  }

  /* ---------- push notifications ---------- */

  window.OneSignalDeferred = window.OneSignalDeferred || [];

  function withOneSignal(fn) {
    window.OneSignalDeferred.push(fn);
  }

  function paintPushState(OneSignal) {
    let granted = false;
    try {
      granted = OneSignal.Notifications.permission === true;
    } catch (err) {
      granted = false;
    }
    const supported = "Notification" in window;

    $("push-notice").classList.toggle("hidden", granted || !supported);
    $("push-status").textContent = !supported
      ? "This browser can't do notifications."
      : granted
        ? "Notifications are on for this device."
        : "Notifications are off.";
  }

  withOneSignal(async function (OneSignal) {
    try {
      await OneSignal.init({
        appId: ONESIGNAL_APP_ID,
        serviceWorkerPath: "/chore-cafe-v2/OneSignalSDKWorker.js",
        serviceWorkerParam: { scope: "/chore-cafe-v2/" }
      });
      paintPushState(OneSignal);
      OneSignal.Notifications.addEventListener("permissionChange", function () {
        paintPushState(OneSignal);
      });
      if (me) await OneSignal.login(me.id);
    } catch (err) {
      $("push-status").textContent = "Notifications couldn't start up.";
    }
  });

  $("enable-push").addEventListener("click", function () {
    withOneSignal(async function (OneSignal) {
      await OneSignal.Notifications.requestPermission();
      paintPushState(OneSignal);
      if (me) await OneSignal.login(me.id);
    });
  });

  /* ---------- labels ---------- */

  function parseDate(text) {
    const bits = text.split("-");
    return new Date(Number(bits[0]), Number(bits[1]) - 1, Number(bits[2]));
  }

  function daysLate(dueText) {
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    return Math.round((today - parseDate(dueText)) / 86400000);
  }

  function dueLabel(dueText) {
    if (!dueText) return "Whenever it needs doing";
    const late = daysLate(dueText);
    if (late > 1) return "<span class='late'>" + late + " days overdue</span>";
    if (late === 1) return "<span class='late'>1 day overdue</span>";
    if (late === 0) return "Due today";
    if (late === -1) return "Due tomorrow";
    return "Due in " + Math.abs(late) + " days";
  }

  function frequencyLabel(chore) {
    if (chore.frequency === "on_demand") return null;
    if (chore.frequency === "one_time") return "One-time";
    if (chore.frequency === "weekly") return "Weekly";
    if (chore.frequency === "biweekly") return "Every 2 weeks";
    if (chore.frequency === "monthly") return "Monthly";
    if (chore.frequency === "quarterly") return "Quarterly";
    if (chore.frequency === "daily") {
      const days = chore.active_days || [];
      if (days.length === 0) return "Weekly";
      if (days.length === 7) return "Every day";
      const sorted = days.slice().sort(function (a, b) { return a - b; });
      return sorted.map(function (d) { return DAY_NAMES[d]; }).join(", ");
    }
    return null;
  }

  function agoLabel(isoText) {
    const then = new Date(isoText);
    const mins = Math.round((Date.now() - then.getTime()) / 60000);
    if (mins < 2) return "just now";
    if (mins < 60) return mins + " minutes ago";
    const hours = Math.round(mins / 60);
    if (hours < 24) return hours === 1 ? "an hour ago" : hours + " hours ago";
    const days = Math.round(hours / 24);
    if (days === 1) return "yesterday";
    if (days < 30) return days + " days ago";
    return then.toLocaleDateString();
  }

  /* ---------- coins ---------- */

  function baseValue(difficulty) {
    if (difficulty === "easy") return settings.coins_easy;
    if (difficulty === "medium") return settings.coins_medium;
    return settings.coins_hard;
  }

  function payout(instance) {
    const base = baseValue(instance.chores.difficulty);
    const forfeited = instance.abandoned_by === me.id;
    if (instance.is_bounty && !forfeited) {
      return Math.round(base * settings.bounty_multiplier);
    }
    return base;
  }

  /* ---------- rendering ---------- */

  function choreCard(instance) {
    const chore = instance.chores;
    const card = document.createElement("div");
    card.className = "chore d-" + chore.difficulty +
                     (instance.is_bounty ? " is-bounty" : "");
    card.title = chore.difficulty.charAt(0).toUpperCase() + chore.difficulty.slice(1);

    const info = document.createElement("div");
    info.className = "info";

    const parts = [];
    const freq = frequencyLabel(chore);
    if (freq) parts.push(escapeHtml(freq));
    parts.push(dueLabel(instance.due_date));
    parts.push("<span class='coins'>" + payout(instance) + " coins</span>");

    let html = "";
    if (instance.is_bounty) html += "<span class='tag'>Bounty</span>";
    html += "<p class='name'>" + escapeHtml(chore.name) + "</p>";
    html += "<p class='meta'>" + parts.join(" &middot; ") + "</p>";
    info.innerHTML = html;

    card.appendChild(info);
    return card;
  }

  function actionButton(label, style, handler) {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "small" + (style ? " " + style : "");
    btn.textContent = label;
    btn.addEventListener("click", async function () {
      btn.disabled = true;
      try {
        await handler();
      } catch (err) {
        toast(err.message || "Something went wrong.");
        btn.disabled = false;
      }
    });
    return btn;
  }

  function renderList(container, instances, builder, emptyText) {
    container.innerHTML = "";
    if (instances.length === 0) {
      const p = document.createElement("p");
      p.className = "empty";
      p.textContent = emptyText;
      container.appendChild(p);
      return;
    }
    instances.forEach(function (instance) {
      container.appendChild(builder(instance));
    });
  }

  function nameOf(id) {
    if (!id) return "Someone";
    if (id === me.id) return "You";
    return people[id] || "They";
  }

  /* ---------- actions ---------- */

  async function acceptChore(id) {
    const { data, error } = await db
      .from("chore_instances")
      .update({
        status: "accepted",
        accepted_by: me.id,
        accepted_at: new Date().toISOString()
      })
      .eq("id", id)
      .eq("status", "pool")
      .select();

    if (error) throw error;
    if (!data || data.length === 0) toast("Someone beat you to that one.");
    await refresh();
  }

  async function releaseChore(id) {
    const { error } = await db
      .from("chore_instances")
      .update({ status: "pool", accepted_by: null, accepted_at: null })
      .eq("id", id)
      .eq("accepted_by", me.id);

    if (error) throw error;
    toast("Back on the board.");
    await refresh();
  }

  async function completeChore(id) {
    const { error } = await db.rpc("complete_chore", { instance_id: id });
    if (error) throw error;
    toast("Nice work.");
    await refresh();
  }

  /* ---------- sheets ---------- */

  function openSheet(id) { $(id).classList.remove("hidden"); }
  function closeSheet(id) { $(id).classList.add("hidden"); }

  function anySheetOpen() {
    return ["add-overlay", "log-overlay", "gift-overlay"].some(function (id) {
      return !$(id).classList.contains("hidden");
    });
  }

  function syncFormBlocks() {
    const freq = $("c-frequency").value;
    $("days-block").classList.toggle("hidden", freq !== "daily");
    $("due-block").classList.toggle("hidden", freq === "on_demand");
  }

  function chosenDays() {
    const boxes = $("days").querySelectorAll("input:checked");
    return Array.prototype.map.call(boxes, function (box) { return Number(box.value); });
  }

  $("open-add").addEventListener("click", function () {
    $("add-form").reset();
    $("add-error").classList.add("hidden");
    $("c-due").value = todayISO();
    syncFormBlocks();
    openSheet("add-overlay");
    $("c-name").focus();
  });

  $("open-log").addEventListener("click", function () {
    $("log-form").reset();
    $("log-error").classList.add("hidden");
    openSheet("log-overlay");
    $("l-name").focus();
  });

  $("cancel-add").addEventListener("click", function () { closeSheet("add-overlay"); });
  $("cancel-log").addEventListener("click", function () { closeSheet("log-overlay"); });
  $("cancel-gift").addEventListener("click", function () { closeSheet("gift-overlay"); });
  $("c-frequency").addEventListener("change", syncFormBlocks);

  ["add-overlay", "log-overlay", "gift-overlay"].forEach(function (id) {
    $(id).addEventListener("click", function (event) {
      if (event.target === $(id)) closeSheet(id);
    });
  });

  document.addEventListener("keydown", function (event) {
    if (event.key !== "Escape") return;
    ["add-overlay", "log-overlay", "gift-overlay"].forEach(closeSheet);
  });

  $("add-form").addEventListener("submit", async function (event) {
    event.preventDefault();
    $("add-error").classList.add("hidden");

    const frequency = $("c-frequency").value;
    const days = frequency === "daily" ? chosenDays() : null;

    if (frequency === "daily" && days.length === 0) {
      $("add-error").textContent = "Pick at least one day of the week.";
      $("add-error").classList.remove("hidden");
      return;
    }
    if (frequency !== "on_demand" && !$("c-due").value) {
      $("add-error").textContent = "Pick a due date.";
      $("add-error").classList.remove("hidden");
      return;
    }

    $("add-submit").disabled = true;
    $("add-submit").textContent = "Adding\u2026";

    const { error } = await db.rpc("create_chore", {
      p_name: $("c-name").value,
      p_difficulty: $("c-difficulty").value,
      p_frequency: frequency,
      p_active_days: days,
      p_due_date: frequency === "on_demand" ? null : $("c-due").value
    });

    $("add-submit").disabled = false;
    $("add-submit").textContent = "Add to the board";

    if (error) {
      $("add-error").textContent = error.message || "Couldn't add that chore.";
      $("add-error").classList.remove("hidden");
      return;
    }

    closeSheet("add-overlay");
    toast("Added to the board.");
    await refresh();
  });

  $("log-form").addEventListener("submit", async function (event) {
    event.preventDefault();
    $("log-error").classList.add("hidden");
    $("log-submit").disabled = true;
    $("log-submit").textContent = "Logging\u2026";

    const { error } = await db.rpc("log_adhoc_task", {
      p_name: $("l-name").value,
      p_difficulty: $("l-difficulty").value
    });

    $("log-submit").disabled = false;
    $("log-submit").textContent = "Claim the coins";

    if (error) {
      $("log-error").textContent = error.message || "Couldn't log that.";
      $("log-error").classList.remove("hidden");
      return;
    }

    closeSheet("log-overlay");
    toast("Logged.");
    await refresh();
  });

  $("gift-form").addEventListener("submit", async function (event) {
    event.preventDefault();
    $("gift-error").classList.add("hidden");
    $("gift-submit").disabled = true;
    $("gift-submit").textContent = "Sending\u2026";

    const { error } = await db.rpc("gift_coins", {
      p_transaction_id: giftTarget,
      p_note: $("g-note").value
    });

    $("gift-submit").disabled = false;
    $("gift-submit").textContent = "Send it";

    if (error) {
      $("gift-error").textContent = error.message || "Couldn't send that.";
      $("gift-error").classList.remove("hidden");
      return;
    }

    closeSheet("gift-overlay");
    toast("Sent.");
    await refresh();
  });

  /* ---------- loading ---------- */

  async function loadReferenceData() {
    const settingsResult = await db.from("settings").select("*").eq("id", 1).single();
    settings = settingsResult.data;

    const profilesResult = await db.from("profiles").select("id, display_name");
    people = {};
    (profilesResult.data || []).forEach(function (row) {
      people[row.id] = row.display_name;
    });

    $("who").textContent = "Signed in as " + (people[me.id] || "you");

    const otherName = Object.keys(people)
      .filter(function (id) { return id !== me.id; })
      .map(function (id) { return people[id]; })[0];

    $("theirs-heading").textContent = otherName ? otherName + "'s" : "Theirs";
  }

  async function loadActivity() {
    const container = $("activity");

    const { data: rows } = await db
      .from("coin_transactions")
      .select("*")
      .order("created_at", { ascending: false })
      .limit(12);

    const { data: myGifts } = await db
      .from("coin_transactions")
      .select("recognizes")
      .eq("from_user", me.id)
      .not("recognizes", "is", null);

    const alreadyGifted = {};
    (myGifts || []).forEach(function (row) { alreadyGifted[row.recognizes] = true; });

    container.innerHTML = "";

    if (!rows || rows.length === 0) {
      const p = document.createElement("p");
      p.className = "empty";
      p.textContent = "Nothing yet. Go do a chore.";
      container.appendChild(p);
      return;
    }

    rows.forEach(function (row) {
      const entry = document.createElement("div");
      entry.className = "entry" + (row.kind === "gift" ? " is-gift" : "");

      const left = document.createElement("div");
      let text;
      if (row.kind === "gift") {
        text = nameOf(row.from_user) + " to " + nameOf(row.user_id).toLowerCase() +
               ": \u201c" + row.reason + "\u201d";
      } else {
        text = nameOf(row.user_id) + " did " + row.reason;
      }
      left.innerHTML = "<p class='what'>" + escapeHtml(text) + "</p>" +
                       "<p class='when'>" + agoLabel(row.created_at) + "</p>";

      const right = document.createElement("div");
      right.className = "right";

      const canGift = row.user_id !== me.id &&
                      row.kind !== "gift" &&
                      !alreadyGifted[row.id];

      if (canGift) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "tiny gift";
        btn.textContent = "Gift";
        btn.addEventListener("click", function () {
          giftTarget = row.id;
          $("gift-form").reset();
          $("gift-error").classList.add("hidden");
          $("gift-lead").textContent =
            settings.gift_amount + " coins to " + (people[row.user_id] || "them") +
            " for " + row.reason + ".";
          openSheet("gift-overlay");
          $("g-note").focus();
        });
        right.appendChild(btn);
      }

      const amount = document.createElement("span");
      amount.className = "amount";
      amount.textContent = "+" + row.amount;
      right.appendChild(amount);

      entry.appendChild(left);
      entry.appendChild(right);
      container.appendChild(entry);
    });
  }

  async function refresh() {
    const { data: instances, error } = await db
      .from("chore_instances")
      .select("*, chores(*)")
      .neq("status", "completed")
      .order("due_date", { ascending: true, nullsFirst: false });

    if (error) {
      toast("Couldn't load the board. Check your connection.");
      return;
    }

    const rows = instances || [];

    const mine = rows.filter(function (r) {
      return r.status === "accepted" && r.accepted_by === me.id;
    });
    const pool = rows.filter(function (r) { return r.status === "pool"; });
    const theirs = rows.filter(function (r) {
      return r.status === "accepted" && r.accepted_by !== me.id;
    });

    renderList($("mine"), mine, function (inst) {
      const card = choreCard(inst);
      const buttons = document.createElement("div");
      buttons.className = "buttons";
      buttons.appendChild(actionButton("Release", "outline", function () {
        return releaseChore(inst.id);
      }));
      buttons.appendChild(actionButton("Done", null, function () {
        return completeChore(inst.id);
      }));
      card.appendChild(buttons);
      return card;
    }, "Nothing on your tray.");

    renderList($("pool"), pool, function (inst) {
      const card = choreCard(inst);
      card.appendChild(actionButton("Accept", null, function () {
        return acceptChore(inst.id);
      }));
      return card;
    }, "The board is clear.");

    renderList($("theirs"), theirs, function (inst) {
      return choreCard(inst);
    }, "Nothing claimed.");

    const { data: coins } = await db
      .from("coin_transactions")
      .select("amount")
      .eq("user_id", me.id);

    const total = (coins || []).reduce(function (sum, row) { return sum + row.amount; }, 0);
    $("coin-count").textContent = total;

    await loadActivity();
  }

  /* ---------- live sync ---------- */

  function scheduleRefresh() {
    clearTimeout(refreshTimer);
    refreshTimer = setTimeout(function () {
      if (me && !anySheetOpen()) refresh();
    }, 400);
  }

  function watchForChanges() {
    if (boardChannel) {
      db.removeChannel(boardChannel);
      boardChannel = null;
    }
    boardChannel = db
      .channel("board")
      .on("postgres_changes",
          { event: "*", schema: "public", table: "chore_instances" },
          scheduleRefresh)
      .on("postgres_changes",
          { event: "*", schema: "public", table: "coin_transactions" },
          scheduleRefresh)
      .subscribe();
  }

  async function startSession(user) {
    me = user;
    showScreen("board");
    await loadReferenceData();
    await db.rpc("generate_due_chores");
    await refresh();
    watchForChanges();
    withOneSignal(async function (OneSignal) {
      try {
        await OneSignal.login(user.id);
        paintPushState(OneSignal);
      } catch (err) {
        // Notifications are optional; the board still works without them.
      }
    });
  }

  /* ---------- auth ---------- */

  $("login").addEventListener("submit", async function (event) {
    event.preventDefault();
    $("error").classList.add("hidden");
    $("signin-btn").disabled = true;
    $("signin-btn").textContent = "Signing in\u2026";

    const { data, error } = await db.auth.signInWithPassword({
      email: $("email").value.trim(),
      password: $("password").value
    });

    $("signin-btn").disabled = false;
    $("signin-btn").textContent = "Sign in";
    $("password").value = "";

    if (error) {
      $("error").textContent = "That email and password don't match an account.";
      $("error").classList.remove("hidden");
      return;
    }
    startSession(data.user);
  });

  $("signout-btn").addEventListener("click", async function () {
    if (boardChannel) {
      db.removeChannel(boardChannel);
      boardChannel = null;
    }
    withOneSignal(async function (OneSignal) {
      try { await OneSignal.logout(); } catch (err) { /* ignore */ }
    });
    await db.auth.signOut();
    me = null;
    showScreen("login");
  });

  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible" && me) refresh();
  });

  (async function start() {
    const { data } = await db.auth.getSession();
    if (data.session) {
      startSession(data.session.user);
    } else {
      showScreen("login");
    }
  })();
</script>

</body>
</html>
