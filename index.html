<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#D4A373">
<title>Chore Cafe</title>
<style>
  :root {
    --cream: #FEFAE0;
    --card: #FFFEF7;
    --tan: #D4A373;
    --tan-dark: #B08554;
    --cocoa: #5C4033;
    --muted: #8B7355;
    --line: #E8DCC4;
    --error: #A33F32;
    --bounty: #C4622D;
    --bounty-bg: #FDF0E4;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--cream);
    color: var(--cocoa);
    font-family: ui-rounded, "Segoe UI", system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.5;
  }

  .wrap {
    max-width: 560px;
    margin: 0 auto;
    padding: 20px 16px 60px;
  }

  .centered {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 32px 28px;
    width: 100%;
    max-width: 380px;
  }

  .sign { text-align: center; margin-bottom: 28px; }
  .sign h1 { font-size: 28px; font-weight: 600; margin: 0 0 4px; letter-spacing: -0.01em; }
  .sign p { margin: 0; color: var(--muted); font-size: 14px; }

  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    margin-bottom: 6px;
  }

  input {
    width: 100%;
    padding: 12px 14px;
    font-size: 16px;
    font-family: inherit;
    color: var(--cocoa);
    background: var(--cream);
    border: 1px solid var(--line);
    border-radius: 10px;
    margin-bottom: 16px;
  }

  input:focus {
    outline: 2px solid var(--tan);
    outline-offset: 1px;
    border-color: var(--tan);
  }

  button {
    font-family: inherit;
    font-size: 16px;
    font-weight: 600;
    color: #fff;
    background: var(--tan);
    border: none;
    border-radius: 10px;
    padding: 12px;
    cursor: pointer;
  }

  button:hover:not(:disabled) { background: var(--tan-dark); }
  button:focus-visible { outline: 2px solid var(--cocoa); outline-offset: 2px; }
  button:disabled { opacity: 0.55; cursor: default; }

  button.wide { width: 100%; padding: 13px; }

  button.quiet {
    background: none;
    color: var(--muted);
    font-weight: 500;
    font-size: 14px;
    padding: 8px;
  }

  button.quiet:hover:not(:disabled) { background: var(--cream); color: var(--cocoa); }

  button.small { font-size: 14px; padding: 9px 16px; }

  button.outline {
    background: none;
    color: var(--muted);
    border: 1px solid var(--line);
  }

  button.outline:hover:not(:disabled) {
    background: var(--cream);
    color: var(--cocoa);
    border-color: var(--tan);
  }

  .error { color: var(--error); font-size: 14px; margin: 0 0 16px; }
  .hidden { display: none; }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding-bottom: 16px;
    border-bottom: 1px dashed var(--line);
    margin-bottom: 8px;
  }

  header h1 { font-size: 22px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
  header .who { font-size: 13px; color: var(--muted); margin: 2px 0 0; }

  .jar { text-align: right; white-space: nowrap; }
  .jar .count { font-size: 22px; font-weight: 600; display: block; line-height: 1.2; }
  .jar .label { font-size: 12px; color: var(--muted); }

  h2 {
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    margin: 28px 0 10px;
  }

  .chore {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
  }

  .chore.is-bounty {
    border: 2px solid var(--bounty);
    background: var(--bounty-bg);
  }

  .chore .info { min-width: 0; }

  .chore .name {
    font-weight: 600;
    margin: 0 0 3px;
    overflow-wrap: anywhere;
  }

  .chore .meta { font-size: 13px; color: var(--muted); margin: 0; }
  .chore .meta .late { color: var(--error); font-weight: 600; }
  .chore .meta .coins { color: var(--cocoa); font-weight: 600; }

  .tag {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #fff;
    background: var(--bounty);
    border-radius: 4px;
    padding: 2px 6px;
    margin-bottom: 5px;
  }

  .buttons { display: flex; gap: 8px; }

  .empty {
    color: var(--muted);
    font-size: 14px;
    font-style: italic;
    margin: 0 0 10px;
    padding: 4px 2px;
  }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 20px;
    transform: translateX(-50%);
    background: var(--cocoa);
    color: var(--cream);
    font-size: 14px;
    padding: 11px 18px;
    border-radius: 999px;
    max-width: 90vw;
    text-align: center;
  }

  .footer { margin-top: 36px; text-align: center; }
</style>
</head>
<body>

<div id="login-screen" class="centered hidden">
  <div class="card">
    <div class="sign">
      <h1>Chore Cafe</h1>
      <p>Now serving</p>
    </div>
    <form id="login" autocomplete="on">
      <p id="error" class="error hidden"></p>
      <label for="email">Email</label>
      <input type="email" id="email" name="email" autocomplete="username" required>
      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>
      <button type="submit" class="wide" id="signin-btn">Sign in</button>
    </form>
  </div>
</div>

<div id="loading-screen" class="centered">
  <p style="color:#8B7355">Opening up&hellip;</p>
</div>

<div id="board-screen" class="wrap hidden">

  <header>
    <div>
      <h1>Chore Cafe</h1>
      <p class="who" id="who"></p>
    </div>
    <div class="jar">
      <span class="count" id="coin-count">0</span>
      <span class="label">coins</span>
    </div>
  </header>

  <h2>Yours</h2>
  <div id="mine"></div>

  <h2>Up for grabs</h2>
  <div id="pool"></div>

  <h2 id="theirs-heading">Theirs</h2>
  <div id="theirs"></div>

  <div class="footer">
    <button type="button" class="quiet" id="signout-btn">Sign out</button>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // ---- PASTE YOUR TWO VALUES BETWEEN THE QUOTES BELOW ----
  const SUPABASE_URL = "https://dvvcgewfmpivzikokdea.supabase.co";
  const SUPABASE_KEY = "sb_publishable_TKIREc13KwUJMs8Owtq09w_nNFV6pVj";
  // --------------------------------------------------------

  const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let me = null;
  let settings = null;
  let people = {};

  function $(id) { return document.getElementById(id); }

  function showScreen(name) {
    $("loading-screen").classList.toggle("hidden", name !== "loading");
    $("login-screen").classList.toggle("hidden", name !== "login");
    $("board-screen").classList.toggle("hidden", name !== "board");
  }

  function toast(message) {
    const existing = document.querySelector(".toast");
    if (existing) existing.remove();
    const node = document.createElement("div");
    node.className = "toast";
    node.setAttribute("role", "status");
    node.textContent = message;
    document.body.appendChild(node);
    setTimeout(function () { node.remove(); }, 3200);
  }

  function escapeHtml(text) {
    const div = document.createElement("div");
    div.textContent = text;
    return div.innerHTML;
  }

  /* ---------- dates ---------- */

  function parseDate(text) {
    const bits = text.split("-");
    return new Date(Number(bits[0]), Number(bits[1]) - 1, Number(bits[2]));
  }

  function daysLate(dueText) {
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    return Math.round((today - parseDate(dueText)) / 86400000);
  }

  function dueLabel(dueText) {
    const late = daysLate(dueText);
    if (late > 1) return "<span class='late'>" + late + " days overdue</span>";
    if (late === 1) return "<span class='late'>1 day overdue</span>";
    if (late === 0) return "Due today";
    if (late === -1) return "Due tomorrow";
    return "Due in " + Math.abs(late) + " days";
  }

  /* ---------- coins ---------- */

  function baseValue(difficulty) {
    if (difficulty === "easy") return settings.coins_easy;
    if (difficulty === "medium") return settings.coins_medium;
    return settings.coins_hard;
  }

  function payout(instance) {
    const base = baseValue(instance.chores.difficulty);
    const forfeited = instance.abandoned_by === me.id;
    if (instance.is_bounty && !forfeited) {
      return Math.round(base * settings.bounty_multiplier);
    }
    return base;
  }

  /* ---------- rendering ---------- */

  function choreCard(instance) {
    const card = document.createElement("div");
    card.className = "chore" + (instance.is_bounty ? " is-bounty" : "");

    const info = document.createElement("div");
    info.className = "info";

    let html = "";
    if (instance.is_bounty) html += "<span class='tag'>Bounty</span>";
    html += "<p class='name'>" + escapeHtml(instance.chores.name) + "</p>";
    html += "<p class='meta'>" + escapeHtml(instance.chores.category) + " &middot; " +
            dueLabel(instance.due_date) + " &middot; " +
            "<span class='coins'>" + payout(instance) + " coins</span></p>";
    info.innerHTML = html;

    card.appendChild(info);
    return card;
  }

  function actionButton(label, style, handler) {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "small" + (style ? " " + style : "");
    btn.textContent = label;
    btn.addEventListener("click", async function () {
      btn.disabled = true;
      try {
        await handler();
      } catch (err) {
        toast(err.message || "Something went wrong.");
        btn.disabled = false;
      }
    });
    return btn;
  }

  function renderList(container, instances, builder, emptyText) {
    container.innerHTML = "";
    if (instances.length === 0) {
      const p = document.createElement("p");
      p.className = "empty";
      p.textContent = emptyText;
      container.appendChild(p);
      return;
    }
    instances.forEach(function (instance) {
      container.appendChild(builder(instance));
    });
  }

  /* ---------- actions ---------- */

  async function acceptChore(id) {
    const { data, error } = await db
      .from("chore_instances")
      .update({
        status: "accepted",
        accepted_by: me.id,
        accepted_at: new Date().toISOString()
      })
      .eq("id", id)
      .eq("status", "pool")
      .select();

    if (error) throw error;
    if (!data || data.length === 0) toast("Someone beat you to that one.");
    await refresh();
  }

  async function releaseChore(id) {
    const { error } = await db
      .from("chore_instances")
      .update({ status: "pool", accepted_by: null, accepted_at: null })
      .eq("id", id)
      .eq("accepted_by", me.id);

    if (error) throw error;
    toast("Back on the board.");
    await refresh();
  }

  async function completeChore(id) {
    const { error } = await db.rpc("complete_chore", { instance_id: id });
    if (error) throw error;
    toast("Nice work.");
    await refresh();
  }

  /* ---------- loading ---------- */

  async function loadReferenceData() {
    const settingsResult = await db.from("settings").select("*").eq("id", 1).single();
    settings = settingsResult.data;

    const profilesResult = await db.from("profiles").select("id, display_name");
    people = {};
    (profilesResult.data || []).forEach(function (row) {
      people[row.id] = row.display_name;
    });

    $("who").textContent = "Signed in as " + (people[me.id] || "you");

    const otherName = Object.keys(people)
      .filter(function (id) { return id !== me.id; })
      .map(function (id) { return people[id]; })[0];

    $("theirs-heading").textContent = otherName ? otherName + "'s" : "Theirs";
  }

  async function refresh() {
    const { data: instances, error } = await db
      .from("chore_instances")
      .select("*, chores(*)")
      .neq("status", "completed")
      .order("due_date", { ascending: true });

    if (error) {
      toast("Couldn't load the board. Check your connection.");
      return;
    }

    const rows = instances || [];

    const mine = rows.filter(function (r) {
      return r.status === "accepted" && r.accepted_by === me.id;
    });
    const pool = rows.filter(function (r) { return r.status === "pool"; });
    const theirs = rows.filter(function (r) {
      return r.status === "accepted" && r.accepted_by !== me.id;
    });

    renderList($("mine"), mine, function (inst) {
      const card = choreCard(inst);
      const buttons = document.createElement("div");
      buttons.className = "buttons";
      buttons.appendChild(actionButton("Release", "outline", function () {
        return releaseChore(inst.id);
      }));
      buttons.appendChild(actionButton("Done", null, function () {
        return completeChore(inst.id);
      }));
      card.appendChild(buttons);
      return card;
    }, "Nothing on your tray.");

    renderList($("pool"), pool, function (inst) {
      const card = choreCard(inst);
      card.appendChild(actionButton("Accept", null, function () {
        return acceptChore(inst.id);
      }));
      return card;
    }, "The board is clear.");

    renderList($("theirs"), theirs, function (inst) {
      return choreCard(inst);
    }, "Nothing claimed.");

    const { data: coins } = await db
      .from("coin_transactions")
      .select("amount")
      .eq("user_id", me.id);

    const total = (coins || []).reduce(function (sum, row) { return sum + row.amount; }, 0);
    $("coin-count").textContent = total;
  }

  async function startSession(user) {
    me = user;
    showScreen("board");
    await loadReferenceData();
    await refresh();
  }

  /* ---------- auth ---------- */

  $("login").addEventListener("submit", async function (event) {
    event.preventDefault();
    $("error").classList.add("hidden");
    $("signin-btn").disabled = true;
    $("signin-btn").textContent = "Signing in\u2026";

    const { data, error } = await db.auth.signInWithPassword({
      email: $("email").value.trim(),
      password: $("password").value
    });

    $("signin-btn").disabled = false;
    $("signin-btn").textContent = "Sign in";
    $("password").value = "";

    if (error) {
      $("error").textContent = "That email and password don't match an account.";
      $("error").classList.remove("hidden");
      return;
    }
    startSession(data.user);
  });

  $("signout-btn").addEventListener("click", async function () {
    await db.auth.signOut();
    me = null;
    showScreen("login");
  });

  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible" && me) refresh();
  });

  (async function start() {
    const { data } = await db.auth.getSession();
    if (data.session) {
      startSession(data.session.user);
    } else {
      showScreen("login");
    }
  })();
</script>

</body>
</html>
